{% extends "warbands/base.html" %}
{% block title %}Log in — Frostgrave Warband Ledger{% endblock %}
{% block content %}
<div class="panel" style="max-width:380px; margin: 3rem auto;">
  <h2>Enter the Ledger</h2>
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label for="id_username">Username</label>
      {{ form.username }}
    </div>
    <div class="field">
      <label for="id_password">Password</label>
      {{ form.password }}
    </div>
    {% if form.errors %}<p class="muted" style="color:#e2917f;">Invalid credentials.</p>{% endif %}
    <button type="submit">Log in</button>
  </form>
  <p class="muted" style="margin-top:1rem;">New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
</div>
{% endblock %}
