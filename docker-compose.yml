version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-frostgrave}
      POSTGRES_USER: ${DB_USER:-frostgrave}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-frostgrave}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-frostgrave}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - static_data:/code/staticfiles
      - media_data:/code/media

volumes:
  postgres_data:
  static_data:
  media_data:
